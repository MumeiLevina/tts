services:
  - type: web
    name: fitcraft
    runtime: node
    buildCommand: npm ci --include=dev && npm run render:build
    startCommand: npm start -- --hostname 0.0.0.0
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
